name: Fetch ACE Presentation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-ace-presentation.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download self-contained HTML
        run: |
          set -euo pipefail
          URL="${{ secrets.ACE_PRESENTATION_SOURCE_URL || 'https://litter.catbox.moe/t5nx3r.html' }}"
          echo "Fetching $URL"
          curl -fsSL "$URL" -o ACE-Presentation.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ACE-Presentation.html')
          text = p.read_text(encoding='utf-8', errors='strict')
          assert text.lstrip().startswith('<!DOCTYPE html>'), text[:80]
          assert 'A.C.E. Distribution' in text
          print('bytes', p.stat().st_size)
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACE-Presentation.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add self-contained ACE-Presentation.html"
          git push
